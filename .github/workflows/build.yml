name: Build and Release

on:
  push:
    branches: [main, master, 'claude/*']
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            cmake_generator: "Unix Makefiles"
            artifact_name: Neve1073-Linux
          - os: windows-latest
            cmake_generator: "Visual Studio 17 2022"
            artifact_name: Neve1073-Windows
          - os: macos-13
            cmake_generator: "Xcode"
            artifact_name: Neve1073-macOS

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libjack-jackd2-dev \
            ladspa-sdk \
            libfreetype6-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxrender-dev \
            libwebkit2gtk-4.0-dev \
            libglu1-mesa-dev \
            mesa-common-dev \
            libcurl4-openssl-dev

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cmake -B build -G "${{ matrix.cmake_generator }}" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -B build -G "${{ matrix.cmake_generator }}" -A x64

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: cmake --build build --config Release -j$(nproc)

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: cmake --build build --config Release -j$(sysctl -n hw.ncpu)

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: cmake --build build --config Release

      - name: Package artifacts (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p artifacts
          cp -r build/Neve1073_artefacts/Release/VST3/*.vst3 artifacts/ 2>/dev/null || true
          cp -r build/Neve1073_artefacts/Release/Standalone/* artifacts/ 2>/dev/null || true

      - name: Package artifacts (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p artifacts
          cp -r build/Neve1073_artefacts/Release/VST3/*.vst3 artifacts/ 2>/dev/null || true
          cp -r build/Neve1073_artefacts/Release/Standalone/*.app artifacts/ 2>/dev/null || true

      - name: Package artifacts (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p artifacts
          cp -r build/Neve1073_artefacts/Release/VST3/*.vst3 artifacts/ 2>/dev/null || true
          cp -r build/Neve1073_artefacts/Release/Standalone/*.exe artifacts/ 2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: artifacts/
          retention-days: 14

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create archives
        run: |
          cd artifacts
          for dir in */; do
            name="${dir%/}"
            zip -r "../${name}.zip" "$dir"
          done

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: "*.zip"
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
